services:
  # ==========================================
  # Servidor Stirling-PDF
  # Herramienta web todo-en-uno para manipulación de PDFs
  # ==========================================
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "${STIRLING_PORT:-8080}:8080"
    volumes:
      - ./stirling/tessdata:/usr/share/tessdata
      - ./stirling/configs:/configs
      - ./stirling/logs:/logs
      - ./stirling/customFiles:/customFiles
      - ./stirling/pipeline:/pipeline
    environment:
      - SECURITY_ENABLELOGIN=${STIRLING_ENABLE_LOGIN:-false}
      - SYSTEM_DEFAULTLOCALE=${STIRLING_DEFAULT_LOCALE:-es-ES}
      - SYSTEM_GOOGLEVISIBILITY=false
      - SYSTEMFILEUPLOADLIMIT=${STIRLING_MAX_FILE_SIZE:-2GB}

  # ==========================================
  # Servidor Open-WA (WA-Automate)
  # Servidor y API para automatización de WhatsApp
  # ==========================================
  openwa:
    image: openwa/wa-automate:latest
    container_name: openwa
    platform: linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "${OPENWA_PORT:-8082}:8080"
    volumes:
      - ./openwa/sessions:/sessions
    environment:
      - PORT=8080
      - WA_PORT=8080
      - WA_API_KEY=${OPENWA_API_KEY:-tu_clave_secreta_aqui}
      - WA_SESSION_ID=${OPENWA_SESSION_ID:-sesion-whatsapp}
      - WA_USER_DATA_DIR=/sessions
    command:
      - "--api-key"
      - "${OPENWA_API_KEY:-tu_clave_secreta_aqui}"
      - "--port"
      - "8080"
      - "--cache-path"
      - "/sessions"
      - "--socket"
